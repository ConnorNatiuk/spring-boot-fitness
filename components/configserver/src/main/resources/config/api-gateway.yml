spring:
    security:
        oauth2:
            resourceserver:
                jwt:
                    jwk-set-uri: ${JWK_SET_URI:http://localhost:8181/realms/fitness-oauth2/protocol/openid-connect/certs}
    cloud:
        gateway:
            server:
                webflux:
                    routes:
                        - id: user-service
                          uri: lb://USER-SERVICE
                          predicates:
                              - Path=/api/users/**

                        - id: activity-service
                          uri: lb://ACTIVITY-SERVICE
                          predicates:
                              - Path=/api/activities/**

                        - id: ai-service
                          uri: lb://AI-SERVICE
                          predicates:
                              - Path=/api/recommendations/**
                    globalcors:
                        cors-configurations:
                            "[/**]":
                                allowedOrigins:
                                    - "http://localhost:5173"
                                allowedMethods:
                                    - GET
                                    - POST
                                    - PUT
                                    - DELETE
                                    - OPTIONS
                                allowedHeaders:
                                    - "*"
server:
    port: 8080
eureka:
    client:
        serviceUrl:
            defaultZone: http://localhost:8761/eureka/

management:
    endpoints:
        web:
            exposure:
                include: gateway,health
    endpoint:
        gateway:
            access: read-only
